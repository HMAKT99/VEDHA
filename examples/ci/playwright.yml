# Copy to .github/workflows/playwright.yml in your project.
# Your tests import from "@vedhajs/playwright-test" instead of "@playwright/test";
# nothing else changes. Guard findings are attached to each test as vedha-guard.json
# and land in the HTML report uploaded below.
name: playwright
on: [push, pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
